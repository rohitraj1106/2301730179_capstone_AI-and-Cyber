[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelmesh-ai"
version = "1.0.0"
description = "SentinelMesh AI: Enterprise Hybrid-Cloud Threat Detection, Explainable Alerting, and Adversarial-Resilient SOAR Prototype"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "lightgbm>=4.3",
    "torch>=2.3",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "playwright>=1.45",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
